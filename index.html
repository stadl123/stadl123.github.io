/* =========================================================================
   Ansicht: STATISTIK
   ========================================================================= */
const METRICS = {
  best: { label: 'Gewicht', unit: 'kg', get: m => m.best, fmt: v => fmtNum(v) },
  e1:   { label: 'e1RM',    unit: 'kg', get: m => m.e1,   fmt: v => fmtNum(v) },
  vol:  { label: 'Volumen', unit: 'kg', get: m => m.vol,  fmt: v => fmtNum(v, 0) },
  reps: { label: 'Wdh.',    unit: '',   get: m => m.reps, fmt: v => fmtNum(v, 0) },
};
function renderStatistik(){
  const host = $('#view-statistik');
  host.innerHTML = '';
  host.append(el('div', { class: 'h1' }, 'Statistik'));

  /* Filterzeile: Übung + Zeitraum (gilt für alles darunter) */
  const usedIds = new Set();
  for (const w of state.workouts){
    if (!w.finishedAt) continue;
    for (const en of w.entries) if (validSets(en).length) usedIds.add(en.exerciseId);
  }
  const exOpts = state.exercises.filter(e => usedIds.has(e.id))
    .sort((a, b) => a.name.localeCompare(b.name, 'de'));
  const sel = el('select', { class: 'in', 'aria-label': 'Übung wählen' },
    el('option', { value: 'all' }, 'Alle Übungen (Überblick)'),
    exOpts.map(e => {
      const o = el('option', { value: e.id }, e.name);
      return o;
    }));
  sel.value = (state.ui.statsExercise === 'all' || usedIds.has(state.ui.statsExercise)) ? state.ui.statsExercise : 'all';
  sel.addEventListener('change', () => { state.ui.statsExercise = sel.value; save(); renderStatistik(); });

  const ranges = [[30, '30 Tage'], [90, '90 Tage'], [365, '1 Jahr'], [0, 'Alles']];
  const seg = el('div', { class: 'seg' }, ranges.map(([d, lab]) =>
    el('button', { class: state.ui.statsRange === d ? 'on' : '', onclick: () => {
      state.ui.statsRange = d; save(); renderStatistik();
    } }, lab)));
  host.append(el('div', { class: 'filters' }, sel, seg));

  const cutoff = state.ui.statsRange ? dateKey(new Date(Date.now() - state.ui.statsRange * 864e5)) : null;

  if (sel.value === 'all') renderStatsOverview(host, cutoff);
  else renderStatsExercise(host, sel.value, cutoff);
}

function renderStatsOverview(host, cutoff){
  const wos = sortedWorkouts().filter(w => w.finishedAt && (!cutoff || w.date >= cutoff) && workoutStats(w).sets > 0);
  let vol = 0, sets = 0;
  for (const w of wos){ const st = workoutStats(w); vol += st.vol; sets += st.sets; }
  host.append(el('div', { class: 'tiles' },
    tile('Trainings', String(wos.length), ''),
    tile('Sätze', fmtNum(sets, 0), ''),
    tile('Volumen', fmtNum(vol, 0), 'kg gesamt')));

  /* Wochen-Volumen als Balken */
  host.append(el('div', { class: 'h2' }, 'Volumen pro Woche'));
  const card = el('div', { class: 'card' });
  host.append(card);
  if (!wos.length){
    card.append(el('div', { class: 'chart-empty' }, 'Noch keine Daten im Zeitraum.'));
    return;
  }
  const weeks = new Map();
  const first = mondayOf(parseKey(wos[0].date));
  const lastMon = mondayOf(new Date());
  for (let t = new Date(first); t <= lastMon; t.setDate(t.getDate() + 7))
    weeks.set(dateKey(t), 0);
  for (const w of wos){
    const wk = dateKey(mondayOf(parseKey(w.date)));
    weeks.set(wk, (weeks.get(wk) || 0) + workoutStats(w).vol);
  }
  let bars = [...weeks.entries()].map(([wk, v]) => ({
    label: 'KW ' + isoWeek(parseKey(wk)), key: wk, value: v }));
  if (bars.length > 26) bars = bars.slice(-26);
  drawBarChart(card, bars, { unit: 'kg' });
  host.append(el('div', { class: 'sub', style: 'margin:2px 4px' },
    'Volumen = Gewicht × Wiederholungen, über alle Sätze zusammengezählt.'));

  /* Sätze je Muskelgruppe */
  const MUSCLE_SHORT = { 'Brust': 'Brust', 'Rücken': 'Rück.', 'Schultern': 'Schul.', 'Arme': 'Arme',
    'Beine': 'Beine', 'Rumpf': 'Rumpf', 'Sonstiges': 'Sonst.', 'Ohne': 'Ohne' };
  const groups = new Map();
  for (const w of wos)
    for (const en of w.entries){
      const vs = validSets(en);
      if (!vs.length) continue;
      const ex = exById(en.exerciseId);
      const g = (ex && ex.muscle) || 'Ohne';
      groups.set(g, (groups.get(g) || 0) + vs.length);
    }
  if (groups.size){
    host.append(el('div', { class: 'h2' }, 'Sätze je Muskelgruppe'));
    const mcard = el('div', { class: 'card' });
    host.append(mcard);
    const order = [...MUSCLES, 'Ohne'];
    const mbars = order.filter(g => groups.has(g))
      .map(g => ({ label: MUSCLE_SHORT[g] || g, full: g, value: groups.get(g) }));
    drawBarChart(mcard, mbars, { unit: 'Sätze', allLabels: true });
    if (groups.has('Ohne'))
      host.append(el('div', { class: 'sub', style: 'margin:2px 4px' },
        '„Ohne" = Übungen ohne Muskelgruppe. Zuordnen kannst du sie im Reiter Übungen.'));
  }

  /* Rekord-Übersicht (alle Zeiten) */
  const recs = [];
  for (const ex of state.exercises){
    const r = exerciseRecord(ex.id);
    if (r) recs.push({ ex, r });
  }
  if (recs.length){
    recs.sort((a, b) => b.r.date.localeCompare(a.r.date));
    host.append(el('div', { class: 'h2' }, 'Rekorde (alle Zeiten)'));
    const rcard = el('div', { class: 'card', style: 'padding:2px 12px' });
    const cut30 = dateKey(new Date(Date.now() - 30 * 864e5));
    for (const { ex, r } of recs){
      rcard.append(el('button', { class: 'li', onclick: () => {
        state.ui.statsExercise = ex.id; save(); renderStatistik(); window.scrollTo(0, 0);
      } },
        el('div', { class: 'grow' },
          el('div', { class: 't' }, ex.name),
          el('div', { class: 's' }, fmtNum(r.w) + ' kg × ' + r.r + ' · ' + fmtFull(r.date))),
        r.date >= cut30 ? el('span', { class: 'chip rec' }, 'neu') : null));
    }
    host.append(rcard);
  }

  /* Tabelle der Trainings */
  host.append(el('div', { class: 'h2' }, 'Alle Trainings im Zeitraum'));
  const tcard = el('div', { class: 'card', style: 'overflow-x:auto' });
  const tbl = el('table', { class: 'datatable' },
    el('thead', {}, el('tr', {}, el('th', {}, 'Datum'), el('th', {}, 'Übungen'), el('th', {}, 'Sätze'), el('th', {}, 'Volumen'))));
  const tb = el('tbody');
  for (const w of [...wos].reverse()){
    const st = workoutStats(w);
    tb.append(el('tr', {}, el('td', {}, fmtFull(w.date)), el('td', {}, String(st.exn)),
      el('td', {}, String(st.sets)), el('td', {}, fmtNum(st.vol, 0) + ' kg')));
  }
  tbl.append(tb); tcard.append(tbl); host.append(tcard);
}

function renderStatsExercise(host, exId, cutoff){
  const ex = exById(exId);
  if (!ex) return;
  const rows = [];
  for (const w of sortedWorkouts()){
    if (!w.finishedAt) continue;
    if (cutoff && w.date < cutoff) continue;
    const m = sessionMetrics(w, exId);
    if (m) rows.push({ date: w.date, ...m });
  }

  /* Kacheln: Rekorde (über alle Zeit) */
  const rec = exerciseRecord(exId);
  let bestE1 = null;
  for (const w of sortedWorkouts()){
    if (!w.finishedAt) continue;
    const m = sessionMetrics(w, exId);
    if (m && (bestE1 === null || m.e1 > bestE1.v)) bestE1 = { v: m.e1, date: w.date };
  }
  const last = rows.length ? rows[rows.length - 1] : null;
  host.append(el('div', { class: 'tiles' },
    tile('Rekord', rec ? fmtNum(rec.w) : '–', rec ? `kg × ${rec.r} · ${fmtShort(rec.date)}` : 'kg'),
    tile('Bestes e1RM', bestE1 ? fmtNum(bestE1.v) : '–', bestE1 ? 'kg · ' + fmtShort(bestE1.date) : 'kg'),
    tile('Letzte Einheit', last ? fmtNum(last.best) : '–', last ? 'kg · ' + fmtShort(last.date) : '')));

  /* Stagnations-Hinweis */
  const stagS = stagnationInfo(exId);
  if (stagS){
    host.append(el('div', { class: 'card', style: 'padding:11px 12px;border-color:rgba(250,178,25,.45)' },
      el('div', { class: 'sub', style: 'color:var(--warn)' }, stagnationText(stagS))));
  }

  /* Damals und heute: Vergleich mit der Einheit vor ~12/6/3 Monaten */
  const cmp = thenComparison(exId);
  if (cmp){
    const d = Math.round((cmp.today.m.e1 - cmp.then.m.e1) * 10) / 10;
    host.append(el('div', { class: 'card', style: 'padding:11px 12px' },
      el('div', { class: 'row' },
        el('div', { class: 'grow', style: 'font-weight:700' }, 'Damals und heute'),
        d > 0.05 ? el('span', { class: 'chip up' }, '▲ +' + fmtNum(d) + ' kg')
          : d < -0.05 ? el('span', { class: 'chip down' }, '▼ ' + fmtNum(d) + ' kg')
          : el('span', { class: 'chip' }, '= gehalten')),
      el('div', { class: 'sub', style: 'margin-top:4px' },
        `${cmp.label} (${fmtFull(cmp.then.date)}): e1RM ${fmtNum(cmp.then.m.e1)} kg — zuletzt (${fmtFull(cmp.today.date)}): ${fmtNum(cmp.today.m.e1)} kg`)));
  }

  /* Metrik-Schalter + Liniendiagramm */
  const seg = el('div', { class: 'seg', style: 'margin-top:2px' },
    Object.entries(METRICS).map(([k, m]) =>
      el('button', { class: state.ui.statsMetric === k ? 'on' : '', onclick: () => {
        state.ui.statsMetric = k; save(); renderStatistik();
      } }, m.label)));
  host.append(seg);

  const metric = METRICS[state.ui.statsMetric] || METRICS.e1;
  const card = el('div', { class: 'card' });
  host.append(card);
  /* Fürs Diagramm pro Tag zusammenfassen (zwei Einheiten am selben Tag → ein Punkt) */
  const byDate = new Map();
  for (const r of rows){
    const a = byDate.get(r.date);
    if (!a) byDate.set(r.date, Object.assign({}, r));
    else {
      a.best = Math.max(a.best, r.best);
      a.e1 = Math.max(a.e1, r.e1);
      a.reps = Math.max(a.reps, r.reps);
      a.vol += r.vol;
    }
  }
  const pts = [...byDate.values()].map(r => ({ x: parseKey(r.date).getTime(), date: r.date, y: metric.get(r) }))
    .filter(p => p.y !== null && p.y !== undefined);
  if (!pts.length && rec){
    card.append(el('div', { class: 'chart-empty' }, 'Keine Einheiten im gewählten Zeitraum — oben einen längeren Zeitraum wählen.'));
  } else {
    drawLineChart(card, pts, metric);
  }

  if (state.ui.statsMetric === 'e1'){
    host.append(el('div', { class: 'sub', style: 'margin:2px 4px' },
      'e1RM = geschätztes Maximalgewicht für 1 Wiederholung (aus Gewicht × Wdh. hochgerechnet).'));
  }
  if (state.ui.statsMetric === 'vol'){
    host.append(el('div', { class: 'sub', style: 'margin:2px 4px' },
      'Volumen = Gewicht × Wiederholungen, über alle Sätze zusammengezählt.'));
  }

  /* Bestleistung je Wiederholungszahl */
  const repPR = new Map();
  for (const w of sortedWorkouts()){
    if (!w.finishedAt) continue;
    for (const s of setsOf(w, exId))
      if (!repPR.has(s.r) || s.w > repPR.get(s.r).w) repPR.set(s.r, { w: s.w, date: w.date });
  }
  if (repPR.size){
    host.append(el('div', { class: 'h2' }, 'Bestwert je Wiederholungszahl (alle Zeiten)'));
    const pcard = el('div', { class: 'card', style: 'overflow-x:auto' });
    const ptbl = el('table', { class: 'datatable' },
      el('thead', {}, el('tr', {}, el('th', {}, 'Wdh.'), el('th', {}, 'Gewicht'), el('th', {}, 'Datum'))));
    const ptb = el('tbody');
    for (const [r, v] of [...repPR.entries()].sort((a, b) => a[0] - b[0])){
      ptb.append(el('tr', {},
        el('td', {}, '× ' + r),
        el('td', {}, fmtNum(v.w) + ' kg'),
        el('td', {}, fmtFull(v.date))));
    }
    ptbl.append(ptb); pcard.append(ptbl); host.append(pcard);
  }

  /* Tabelle */
  host.append(el('div', { class: 'h2' }, 'Einheiten'));
  const tcard = el('div', { class: 'card', style: 'overflow-x:auto' });
  const tbl = el('table', { class: 'datatable' },
    el('thead', {}, el('tr', {},
      el('th', {}, 'Datum'), el('th', {}, 'Bester Satz'), el('th', {}, 'e1RM'), el('th', {}, 'Volumen'))));
  const tb = el('tbody');
  for (const r of [...rows].reverse()){
    tb.append(el('tr', {},
      el('td', {}, fmtFull(r.date)),
      el('td', {}, fmtNum(r.best) + ' × ' + r.bestReps),
      el('td', {}, fmtNum(r.e1) + ' kg'),
      el('td', {}, fmtNum(r.vol, 0) + ' kg')));
  }
  if (!rows.length) tb.append(el('tr', {}, el('td', { colspan: '4', style: 'color:var(--muted)' }, 'Keine Einheiten im Zeitraum.')));
  tbl.append(tb); tcard.append(tbl); host.append(tcard);
}
/* Vergleich mit der Einheit vor ~12, 6 oder 3 Monaten (was zuerst passt) */
function thenComparison(exId){
  const windows = [[365, 'Vor einem Jahr'], [180, 'Vor 6 Monaten'], [90, 'Vor 3 Monaten']];
  const sessions = [];
  for (const w of sortedWorkouts()){
    if (!w.finishedAt) continue;
    const m = sessionMetrics(w, exId);
    if (m) sessions.push({ date: w.date, m });
  }
  if (sessions.length < 2) return null;
  const today = sessions[sessions.length - 1];
  const anchor = parseKey(today.date).getTime();
  for (const [days, label] of windows){
    const tol = Math.max(21, days * 0.15);
    let best = null;
    for (const s2 of sessions){
      if (s2 === today) continue;
      const age = (anchor - parseKey(s2.date).getTime()) / 864e5;
      const off = Math.abs(age - days);
      if (age > 0 && off <= tol && (!best || off < best.off)) best = { s: s2, off };
    }
    if (best) return { label, then: best.s, today };
  }
  return null;
}
function tile(label, value, sub){
  return el('div', { class: 'tile' },
    el('div', { class: 'l' }, label),
    el('div', { class: 'v' }, value),
    sub ? el('div', { class: 'd' }, sub) : null);
}

/* ---------- Diagramme (SVG von Hand, eine Serie, Akzentblau) ---------- */
const CH = { accent: '#3987e5', grid: '#2c2c2a', axis: '#383835', muted: '#898781',
  ink2: '#c3c2b7', surface: '#1a1a19' };
function svgEl(tag, attrs = {}){
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
}
function niceTicks(min, max, count){
  if (!isFinite(min) || !isFinite(max)) { min = 0; max = 1; }
  if (min === max){ max = min + 1; min = Math.max(0, min - 1); }
  const step0 = (max - min) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 1e-6; v += step) ticks.push(Math.round(v * 1000) / 1000);
  return { lo, hi, ticks, dec: step < 1 ? 1 : 0 };
}
function chartFrame(card, H){
  const wrap = el('div', { class: 'chartwrap' });
  card.innerHTML = '';
  card.append(wrap);
  const W = Math.max(280, card.clientWidth - 28);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H });
  wrap.append(svg);
  const tip = el('div', { class: 'tooltip' });
  wrap.append(tip);
  return { wrap, svg, tip, W };
}
function drawLineChart(card, pts, metric){
  const H = 230;
  const { wrap, svg, tip, W } = chartFrame(card, H);
  if (pts.length === 0){
    svg.remove();
    wrap.append(el('div', { class: 'chart-empty' }, 'Noch keine Einheiten — nach dem ersten Training erscheint hier deine Kurve.'));
    return;
  }
  const pad = { l: 46, r: 18, t: 16, b: 30 };
  const xs = pts.map(p => p.x);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x0 === x1){ x0 -= 864e5; x1 += 864e5; }
  const ys = pts.map(p => p.y);
  const { lo, hi, ticks, dec } = niceTicks(Math.min(...ys), Math.max(...ys), 4);
  const X = x => pad.l + (x - x0) / (x1 - x0) * (W - pad.l - pad.r);
  const Y = y => pad.t + (1 - (y - lo) / (hi - lo)) * (H - pad.t - pad.b);

  for (const tv of ticks){
    svg.append(svgEl('line', { x1: pad.l, x2: W - pad.r, y1: Y(tv), y2: Y(tv), stroke: CH.grid, 'stroke-width': 1 }));
    const lab = svgEl('text', { x: pad.l - 8, y: Y(tv) + 3.5, fill: CH.muted, 'font-size': 10.5,
      'text-anchor': 'end', style: 'font-variant-numeric:tabular-nums' });
    lab.textContent = fmtNum(tv, dec);
    svg.append(lab);
  }
  /* X-Beschriftung: 3–4 Daten, gleichmäßig über die BREITE verteilt und ohne Überlappung */
  const li = pts.length - 1;
  let idxs;
  if (pts.length <= 4){
    idxs = pts.map((_, i) => i);
  } else {
    const set = new Set();
    for (let k = 0; k < 4; k++){
      const tx = pad.l + k / 3 * (W - pad.l - pad.r);
      let bi = 0, bd = Infinity;
      pts.forEach((p, i) => { const d = Math.abs(X(p.x) - tx); if (d < bd){ bd = d; bi = i; } });
      set.add(bi);
    }
    idxs = [...set].sort((a, b) => a - b);
  }
  let lastLabX = -Infinity;
  for (const i of idxs){
    const lx = X(pts[i].x);
    if (lx - lastLabX < 45) continue;
    lastLabX = lx;
    const lab = svgEl('text', { x: lx, y: H - 8, fill: CH.muted, 'font-size': 10.5, 'text-anchor': 'middle' });
    lab.textContent = fmtShort(pts[i].date);
    svg.append(lab);
  }
  /* Fläche + Linie */
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1)).join(' ');
  if (pts.length > 1){
    svg.append(svgEl('path', {
      d: line + ` L${X(pts[li].x).toFixed(1)},${(H - pad.b).toFixed(1)} L${X(pts[0].x).toFixed(1)},${(H - pad.b).toFixed(1)} Z`,
      fill: CH.accent, opacity: 0.1 }));
    svg.append(svgEl('path', { d: line, fill: 'none', stroke: CH.accent, 'stroke-width': 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  }
  pts.forEach((p, i) => {
    svg.append(svgEl('circle', { cx: X(p.x), cy: Y(p.y), r: i === li ? 5 : 4,
      fill: CH.accent, stroke: CH.surface, 'stroke-width': 2 }));
  });
  /* Endwert direkt beschriften */
  const endLab = svgEl('text', { x: Math.min(X(pts[li].x), W - pad.r - 2), y: Math.max(12, Y(pts[li].y) - 10),
    fill: CH.ink2, 'font-size': 12, 'font-weight': 650, 'text-anchor': 'end' });
  endLab.textContent = metric.fmt(pts[li].y) + (metric.unit ? ' ' + metric.unit : '');
  svg.append(endLab);

  /* Fadenkreuz + Tooltip */
  const cross = svgEl('line', { y1: pad.t, y2: H - pad.b, stroke: CH.axis, 'stroke-width': 1, opacity: 0 });
  svg.append(cross);
  const hit = svgEl('rect', { x: 0, y: 0, width: W, height: H, fill: 'transparent' });
  svg.append(hit);
  function showTip(clientX){
    const rect = svg.getBoundingClientRect();
    const px = (clientX - rect.left) * (W / rect.width);
    let best = 0, bd = Infinity;
    pts.forEach((p, i) => { const d = Math.abs(X(p.x) - px); if (d < bd){ bd = d; best = i; } });
    const p = pts[best];
    cross.setAttribute('x1', X(p.x)); cross.setAttribute('x2', X(p.x));
    cross.setAttribute('opacity', 1);
    tip.innerHTML = '';
    tip.append(el('b', {}, metric.fmt(p.y) + (metric.unit ? ' ' + metric.unit : '')), fmtFull(p.date));
    tip.style.display = 'block';
    const left = Math.max(52, Math.min(X(p.x) / W * rect.width, rect.width - 52));
    tip.style.left = left + 'px';
    tip.style.top = Math.max(0, Y(p.y) / H * rect.height - 58) + 'px';
  }
  hit.addEventListener('pointermove', e => showTip(e.clientX));
  hit.addEventListener('pointerdown', e => showTip(e.clientX));
  hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; cross.setAttribute('opacity', 0); });
}
function drawBarChart(card, bars, { unit, allLabels }){
  const H = 210;
  const { wrap, svg, tip, W } = chartFrame(card, H);
  if (!bars.length){
    svg.remove();
    wrap.append(el('div', { class: 'chart-empty' }, 'Noch keine Daten.'));
    return;
  }
  const pad = { l: 46, r: 10, t: 14, b: 28 };
  const { lo, hi, ticks, dec } = niceTicks(0, Math.max(...bars.map(b => b.value), 1), 4);
  const Y = y => pad.t + (1 - (y - lo) / (hi - lo)) * (H - pad.t - pad.b);
  const band = (W - pad.l - pad.r) / bars.length;
  const bw = Math.min(24, Math.max(6, band - 4));

  for (const tv of ticks){
    svg.append(svgEl('line', { x1: pad.l, x2: W - pad.r, y1: Y(tv), y2: Y(tv), stroke: CH.grid, 'stroke-width': 1 }));
    const lab = svgEl('text', { x: pad.l - 8, y: Y(tv) + 3.5, fill: CH.muted, 'font-size': 10.5,
      'text-anchor': 'end', style: 'font-variant-numeric:tabular-nums' });
    lab.textContent = fmtNum(tv, dec);
    svg.append(lab);
  }
  const step = allLabels ? 1 : Math.max(1, Math.ceil(bars.length / 6));
  bars.forEach((b, i) => {
    const cx = pad.l + band * i + band / 2;
    const y = Y(b.value), y0 = Y(lo);
    const h = Math.max(0, y0 - y);
    if (h > 0){
      const r = Math.min(4, bw / 2, h);
      const x = cx - bw / 2;
      svg.append(svgEl('path', { d:
        `M${x},${y0} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${y0} Z`,
        fill: CH.accent, 'data-i': i }));
    }
    if (i % step === 0 || i === bars.length - 1){
      const lab = svgEl('text', { x: cx, y: H - 7, fill: CH.muted, 'font-size': 10, 'text-anchor': 'middle' });
      lab.textContent = b.label;
      svg.append(lab);
    }
  });
  svg.append(svgEl('line', { x1: pad.l, x2: W - pad.r, y1: Y(lo), y2: Y(lo), stroke: CH.axis, 'stroke-width': 1 }));
  /* EINE Treffer-Fläche über die ganze Plotfläche — funktioniert auch mit dem Finger (Tippen UND Wischen) */
  const hitAll = svgEl('rect', { x: pad.l, y: pad.t, width: W - pad.l - pad.r, height: H - pad.t - pad.b, fill: 'transparent' });
  function showBarTip(clientX){
    const rect = svg.getBoundingClientRect();
    const px = (clientX - rect.left) * (W / rect.width);
    const i = Math.max(0, Math.min(bars.length - 1, Math.floor((px - pad.l) / band)));
    const b = bars[i];
    const cx = pad.l + band * i + band / 2;
    tip.innerHTML = '';
    tip.append(el('b', {}, fmtNum(b.value, 0) + ' ' + unit), b.full || b.label);
    tip.style.display = 'block';
    tip.style.left = Math.max(52, Math.min(cx / W * rect.width, rect.width - 52)) + 'px';
    tip.style.top = Math.max(0, Y(b.value) / H * rect.height - 56) + 'px';
  }
  hitAll.addEventListener('pointermove', e => showBarTip(e.clientX));
  hitAll.addEventListener('pointerdown', e => showBarTip(e.clientX));
  hitAll.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
  svg.append(hitAll);
}

/* =========================================================================
   Ansicht: ERNÄHRUNG (Kalorien & Makros)
   ========================================================================= */
const MEALS = [['frueh','Frühstück'], ['mittag','Mittag'], ['abend','Abend'], ['snack','Snacks']];
let curFoodDay = null;
/* Solange „Heute" gewählt ist, folgt die Ansicht dem echten Datum (wichtig nach Mitternacht) */
let foodDayIsToday = true;
function activeFoodDay(){
  return foodDayIsToday ? dateKey(new Date()) : (curFoodDay || dateKey(new Date()));
}

function ensureDay(dk){
  if (!state.days[dk]) state.days[dk] = { entries: [] };
  return state.days[dk];
}
function dayTotals(dk){
  const t = { kcal: 0, fat: 0, carb: 0, prot: 0 };
  const d = state.days[dk];
  if (d) for (const e of d.entries){ t.kcal += e.kcal; t.fat += e.fat; t.carb += e.carb; t.prot += e.prot; }
  return t;
}
function foodMacros(food, grams){
  const f = grams / 100;
  return {
    kcal: Math.round((food.kcal || 0) * f),
    fat: Math.round((food.fat || 0) * f * 10) / 10,
    carb: Math.round((food.carb || 0) * f * 10) / 10,
    prot: Math.round((food.prot || 0) * f * 10) / 10,
  };
}

function renderErnaehrung(){
  const host = $('#view-ernaehrung');
  host.innerHTML = '';
  if (foodDayIsToday || !curFoodDay) curFoodDay = dateKey(new Date());
  const dk = curFoodDay;
  const today = dateKey(new Date());
  const g0 = parseKey(today); g0.setDate(g0.getDate() - 1);
  const gest = dateKey(g0);

  host.append(el('div', { class: 'h1' }, 'Ernährung'));

  /* Tages-Navigation */
  const label = dk === today ? 'Heute' : dk === gest ? 'Gestern' : fmtDay(dk);
  host.append(el('div', { class: 'dayrow' },
    el('button', { class: 'dbtn', 'aria-label': 'Tag zurück', onclick: () => {
      const d = parseKey(dk); d.setDate(d.getDate() - 1);
      curFoodDay = dateKey(d);
      foodDayIsToday = (curFoodDay === dateKey(new Date()));
      renderErnaehrung();
    } }, '‹'),
    el('button', { class: 'dlabel', onclick: () => {
      curFoodDay = dateKey(new Date()); foodDayIsToday = true; renderErnaehrung();
    } }, label),
    el('button', { class: 'dbtn', 'aria-label': 'Tag vor', onclick: () => {
      const d = parseKey(dk); d.setDate(d.getDate() + 1);
      curFoodDay = dateKey(d);
      foodDayIsToday = (curFoodDay === dateKey(new Date()));
      renderErnaehrung();
    } }, '›')));

  /* Tages-Zusammenfassung */
  const t = dayTotals(dk);
  const M = state.settings.macro;
  const left = Math.round(M.kcal - t.kcal);
  const sum = el('div', { class: 'card' });
  sum.append(el('div', { class: 'row' },
    el('div', { class: 'grow' },
      el('div', { class: 'sub' }, `${fmtNum(t.kcal, 0)} von ${fmtNum(M.kcal, 0)} kcal gegessen`),
      el('div', { class: 'kcalbig', style: left < 0 ? 'color:var(--warn)' : '' },
        left >= 0 ? fmtNum(left, 0) : fmtNum(-left, 0)),
      el('div', { class: 'sub' }, left >= 0 ? 'kcal übrig' : 'kcal über dem Ziel')),
    el('button', { class: 'iconbtn', 'aria-label': 'Ziele anpassen', onclick: openMacroTargets }, '✎')));
  const kb = el('div', { class: 'macrobar' });
  kb.append(el('div', { class: t.kcal > M.kcal ? 'over' : '', style: `width:${Math.min(100, 100 * t.kcal / Math.max(1, M.kcal))}%` }));
  sum.append(kb);
  const mrow = (name, val, target) => {
    const wrap = el('div', { style: 'margin-top:10px' });
    wrap.append(el('div', { class: 'row' },
      el('div', { class: 'grow', style: 'font-size:13px;color:var(--ink2)' }, name),
      el('div', { class: 'sub mono' }, `${fmtNum(val, 0)} / ${fmtNum(target, 0)} g`)));
    const bar = el('div', { class: 'macrobar' });
    bar.append(el('div', { class: val > target ? 'over' : '', style: `width:${Math.min(100, 100 * val / Math.max(1, target))}%` }));
    wrap.append(bar);
    return wrap;
  };
  sum.append(mrow('Eiweiß', t.prot, M.prot), mrow('Fett', t.fat, M.fat), mrow('Kohlenhydrate', t.carb, M.carb));
  host.append(sum);

  /* Mahlzeiten */
  const day = state.days[dk];
  for (const [mKey, mName] of MEALS){
    const entries = day ? day.entries.filter(e => e.meal === mKey) : [];
    const mkcal = entries.reduce((n, e) => n + e.kcal, 0);
    host.append(el('div', { class: 'mealhead' },
      el('div', { class: 't' }, mName),
      entries.length ? el('div', { class: 'kc' }, fmtNum(mkcal, 0) + ' kcal') : null,
      el('button', { class: 'add', html: IC.plus, 'aria-label': mName + ' hinzufügen',
        onclick: () => openFoodPicker(mKey) })));
    if (entries.length){
      const c = el('div', { class: 'card', style: 'padding:2px 12px' });
      for (const e of entries){
        c.append(el('button', { class: 'fentry', onclick: () => openEntryEditor(dk, e) },
          el('div', { class: 'grow' },
            el('div', { class: 'n' }, e.name),
            el('div', { class: 's' },
              (e.grams ? e.grams + ' g · ' : '') +
              `E ${fmtNum(e.prot)} · F ${fmtNum(e.fat)} · KH ${fmtNum(e.carb)}`)),
          el('div', { class: 'kc' }, fmtNum(e.kcal, 0))));
      }
      host.append(c);
    }
  }

  /* Körpergewicht */
  host.append(el('div', { class: 'mealhead', style: 'margin-top:20px' },
    el('div', { class: 't' }, 'Körpergewicht'),
    el('button', { class: 'add', html: IC.plus, 'aria-label': 'Gewicht eintragen',
      onclick: openWeightSheet })));
  const wKeys = Object.keys(state.weights).sort();
  if (wKeys.length){
    const wcard = el('div', { class: 'card' });
    const lastK = wKeys[wKeys.length - 1];
    const lastKg = state.weights[lastK];
    /* Vergleich: nächstliegender Eintrag von vor mindestens 6 Tagen */
    const anchor = parseKey(lastK); anchor.setDate(anchor.getDate() - 6);
    const anchorK = dateKey(anchor);
    const prevKeys = wKeys.filter(k => k <= anchorK);
    const baseK = prevKeys.length ? prevKeys[prevKeys.length - 1] : null;
    let deltaTxt = '';
    if (baseK){
      const d = Math.round((lastKg - state.weights[baseK]) * 10) / 10;
      deltaTxt = ` · ${d > 0 ? '+' : ''}${fmtNum(d, 1)} kg seit ${fmtShort(baseK)}`;
    }
    wcard.append(el('div', { class: 'row' },
      el('div', { class: 'grow' },
        el('div', { class: 'kcalbig' }, fmtNum(lastKg, 1) + ' kg'),
        el('div', { class: 'sub' }, 'zuletzt am ' + fmtFull(lastK) + deltaTxt))));
    if (wKeys.length >= 2){
      const pts = wKeys.slice(-60).map(k => ({ x: parseKey(k).getTime(), date: k, y: state.weights[k] }));
      const chartHost = el('div', { style: 'margin-top:8px' });
      wcard.append(chartHost);
      drawLineChart(chartHost, pts, { unit: 'kg', fmt: v2 => fmtNum(v2, 1) });
    }
    host.append(wcard);
    /* Wochenübersicht: Ø pro Woche mit Veränderung */
    const byWeek = new Map();
    for (const k of wKeys){
      const wk = dateKey(mondayOf(parseKey(k)));
      if (!byWeek.has(wk)) byWeek.set(wk, []);
      byWeek.get(wk).push(state.weights[k]);
    }
    const weeks = [...byWeek.entries()]
      .map(([wk, arr]) => ({ wk, avg: Math.round(arr.reduce((a, b) => a + b, 0) / arr.length * 10) / 10 }))
      .sort((a, b) => a.wk.localeCompare(b.wk));
    if (weeks.length >= 2){
      const tcard = el('div', { class: 'card', style: 'overflow-x:auto' });
      const tbl = el('table', { class: 'datatable' },
        el('thead', {}, el('tr', {},
          el('th', {}, 'Woche'), el('th', {}, 'Ø Gewicht'), el('th', {}, 'Veränderung'))));
      const tb = el('tbody');
      const lastWeeks = weeks.slice(-8);
      for (let i = lastWeeks.length - 1; i >= 0; i--){
        const w2 = lastWeeks[i];
        const prev = i > 0 ? lastWeeks[i - 1] : (weeks.length > lastWeeks.length ? weeks[weeks.length - lastWeeks.length - 1] : null);
        const d = prev ? Math.round((w2.avg - prev.avg) * 10) / 10 : null;
        tb.append(el('tr', {},
          el('td', {}, 'KW ' + isoWeek(parseKey(w2.wk))),
          el('td', {}, fmtNum(w2.avg, 1) + ' kg'),
          el('td', {}, d === null ? '—' : (d > 0 ? '+' : '') + fmtNum(d, 1) + ' kg')));
      }
      tbl.append(tb); tcard.append(tbl); host.append(tcard);
    }
  } else {
    host.append(el('div', { class: 'sub', style: 'margin:4px 2px' },
      'Wiege dich regelmäßig (am besten morgens) und trage das Gewicht hier ein — dann siehst du Kurve und Wochen-Durchschnitt.'));
  }

  /* Supplemente: dein aktueller Plan */
  host.append(el('div', { class: 'mealhead', style: 'margin-top:20px' },
    el('div', { class: 't' }, 'Supplemente'),
    el('button', { class: 'add', html: IC.plus, 'aria-label': 'Supplement hinzufügen',
      onclick: () => openSuppEditor(null) })));
  if (state.supps.length){
    const scard = el('div', { class: 'card', style: 'padding:2px 12px' });
    const sorted = [...state.supps].sort((a, b) =>
      (a.paused ? 1 : 0) - (b.paused ? 1 : 0) || a.name.localeCompare(b.name, 'de'));
    for (const s of sorted){
      const bits = [];
      if (s.dose) bits.push(s.dose);
      if (s.timing.length) bits.push(s.timing.join(' & '));
      bits.push('seit ' + fmtFull(dateKey(new Date(s.sinceAt))));
      scard.append(el('button', { class: 'fentry', style: s.paused ? 'opacity:.5' : '',
        onclick: () => openSuppEditor(s.id) },
        el('div', { class: 'grow' },
          el('div', { class: 'n' }, s.name + (s.paused ? ' · pausiert' : '')),
          el('div', { class: 's' }, bits.join(' · ')),
          s.note ? el('div', { class: 's', style: 'font-style:italic' }, s.note) : null)));
    }
    host.append(scard);
  } else {
    host.append(el('div', { class: 'sub', style: 'margin:4px 2px' },
      'Hier notierst du deinen aktuellen Plan — z. B. „Kreatin, 5 g, morgens". So behältst du den Überblick, was du gerade nimmst und seit wann.'));
  }

  /* Wochen-Überblick */
  const days14 = [];
  const base = parseKey(today);
  for (let i = 13; i >= 0; i--){
    const d = new Date(base);
    d.setDate(base.getDate() - i);
    const k = dateKey(d);
    days14.push({ key: k, label: fmtShort(k), value: dayTotals(k).kcal });
  }
  if (days14.some(d => d.value > 0)){
    host.append(el('div', { class: 'h2' }, 'Letzte 14 Tage'));
    const ccard = el('div', { class: 'card' });
    host.append(ccard);
    drawBarChart(ccard, days14, { unit: 'kcal' });
    const week = days14.slice(-7).filter(d => d.value > 0);
    if (week.length){
      let p7 = 0;
      for (const d of week) p7 += (state.days[d.key] ? state.days[d.key].entries.reduce((n, e) => n + e.prot, 0) : 0);
      host.append(el('div', { class: 'sub', style: 'margin:2px 4px' },
        `Ø letzte 7 Tage (nur erfasste): ${fmtNum(week.reduce((n, d) => n + d.value, 0) / week.length, 0)} kcal · ${fmtNum(p7 / week.length, 0)} g Eiweiß am Tag`));
    }
  }
}

/* Körpergewicht eintragen (für den gerade angezeigten Tag) */
function openWeightSheet(){
  const dk = activeFoodDay();
  const today = dateKey(new Date());
  const wKeys = Object.keys(state.weights).sort();
  const lastKg = wKeys.length ? state.weights[wKeys[wKeys.length - 1]] : null;
  openSheet('Körpergewicht', (body, close) => {
    const wIn = el('input', { class: 'in', inputmode: 'decimal', autocomplete: 'off',
      style: 'font-size:24px;text-align:center;font-weight:750',
      value: state.weights[dk] !== undefined ? fmtInput(state.weights[dk]) : (lastKg !== null ? fmtInput(lastKg) : ''),
      placeholder: 'kg' });
    body.append(el('label', { class: 'f' },
      el('span', {}, 'Gewicht in kg ' + (dk === today ? '(heute)' : '(für den ' + fmtFull(dk) + ')')), wIn));
    if (dk !== today) body.append(el('div', { class: 'sub', style: 'margin-top:6px' },
      'Tipp: Mit den ‹ ›-Pfeilen oben kannst du auch vergangene Tage nachtragen.'));
    body.append(el('button', { class: 'btn primary block', style: 'margin-top:14px', onclick: () => {
      const v = parseNum(wIn.value);
      if (v === null || v < 20 || v > 400){ wIn.classList.add('err'); return; }
      state.weights[dk] = Math.round(v * 10) / 10;
      save(); close();
      renderErnaehrung();
      toast('Gewicht gespeichert: ' + fmtNum(state.weights[dk], 1) + ' kg');
    } }, 'Speichern'));
    if (state.weights[dk] !== undefined){
      body.append(el('button', { class: 'btn block danger', style: 'margin-top:8px', onclick: async () => {
        if (await confirmDlg('Gewichts-Eintrag für diesen Tag löschen?', { okLabel: 'Löschen', danger: true })){
          delete state.weights[dk];
          save(); close(); renderErnaehrung();
        }
      } }, 'Eintrag löschen'));
    }
    setTimeout(() => { wIn.focus(); try { wIn.select(); } catch (e) {} }, 60);
  });
}

/* Supplement anlegen/bearbeiten */
const SUPP_TIMES = ['Morgens', 'Mittags', 'Abends', 'Vor dem Training', 'Nach dem Training', 'Zum Essen'];
function openSuppEditor(suppId){
  const isNew = !suppId;
  const s = isNew
    ? { id: uid(), name: '', dose: '', timing: [], note: '', paused: false,
        sinceAt: Date.now(), createdAt: Date.now() }
    : state.supps.find(x => x.id === suppId);
  if (!s) return;
  openSheet(isNew ? 'Neues Supplement' : s.name, (body, close) => {
    const nameIn = el('input', { class: 'in', value: s.name, placeholder: 'z. B. Kreatin' });
    const doseIn = el('input', { class: 'in', value: s.dose, placeholder: 'z. B. 5 g oder 2 Kapseln' });
    const sel = new Set(s.timing);
    const chips = el('div', { style: 'display:flex;flex-wrap:wrap;gap:8px' });
    for (const t of SUPP_TIMES){
      const b = el('button', { class: 'chip' + (sel.has(t) ? ' acc' : ''), style: 'padding:8px 12px;font-size:13.5px' }, t);
      b.addEventListener('click', () => {
        if (sel.has(t)) sel.delete(t); else sel.add(t);
        b.className = 'chip' + (sel.has(t) ? ' acc' : '');
      });
      chips.append(b);
    }
    const noteIn = el('textarea', { class: 'in', placeholder: 'Notiz (z. B. „mit viel Wasser", Marke, Grund) …',
      style: 'min-height:60px' });
    noteIn.value = s.note || '';
    body.append(
      el('label', { class: 'f' }, el('span', {}, 'Name'), nameIn),
      el('label', { class: 'f' }, el('span', {}, 'Menge pro Einnahme'), doseIn),
      el('label', { class: 'f' }, el('span', {}, 'Wann? (mehrere möglich)'), chips),
      el('label', { class: 'f' }, el('span', {}, 'Notiz'), noteIn));
    if (!isNew) body.append(el('div', { class: 'sub', style: 'margin-top:8px' },
      'Diese Einstellung gilt seit ' + fmtFull(dateKey(new Date(s.sinceAt))) +
      '. Änderst du Menge oder Zeitpunkt, startet das Datum neu.'));
    body.append(el('button', { class: 'btn primary block', style: 'margin-top:14px', onclick: () => {
      const name = nameIn.value.trim();
      if (!name){ nameIn.classList.add('err'); nameIn.focus(); return; }
      const newTiming = SUPP_TIMES.filter(t => sel.has(t));
      /* Dosis-/Zeitpunkt-Änderung = neue Einstellung → „seit"-Datum neu setzen */
      if (!isNew && (s.dose !== doseIn.value.trim() || s.timing.join('|') !== newTiming.join('|')))
        s.sinceAt = Date.now();
      s.name = name;
      s.dose = doseIn.value.trim();
      s.timing = newTiming;
      s.note = noteIn.value.trim();
      if (isNew) state.supps.push(s);
      save(); close();
      if (curView === 'ernaehrung') renderErnaehrung();
    } }, 'Speichern'));
    if (!isNew){
      body.append(el('button', { class: 'btn block', style: 'margin-top:8px', onclick: () => {
        s.paused = !s.paused;
        save(); close();
        if (curView === 'ernaehrung') renderErnaehrung();
      } }, s.paused ? 'Weiter nehmen (Pause beenden)' : 'Pausieren (nehme ich gerade nicht)'));
      body.append(el('button', { class: 'btn block danger', style: 'margin-top:8px', onclick: async () => {
        if (await confirmDlg(`„${s.name}" aus deinem Supplement-Plan löschen?`, { okLabel: 'Löschen', danger: true })){
          state.supps = state.supps.filter(x => x.id !== s.id);
          save(); close();
          if (curView === 'ernaehrung') renderErnaehrung();
        }
      } }, 'Löschen'));
    }
    if (isNew) setTimeout(() => nameIn.focus(), 60);
  });
}

/* Lebensmittel auswählen (Suche, Favoriten, Scanner, Neuanlage) */
function openFoodPicker(meal){
  openSheet('Was hast du gegessen?', (body, close) => {
    body.append(el('div', { style: 'display:flex;gap:8px;margin-bottom:10px' },
      el('button', { class: 'btn grow', onclick: () => { close(); openScanner(code => handleBarcode(code, meal)); } },
        el('span', { html: IC.scan }), 'Scannen'),

        el('span', { html: IC.plus }), 'Neu')));

    const list = el('div', { class: 'card', style: 'padding:2px 12px;margin-top:10px' });
    function renderList(){
      const q = search.value.trim().toLowerCase();
      list.innerHTML = '';
      const items = state.foods
        .filter(f => !q || f.name.toLowerCase().includes(q) || (f.brand && f.brand.toLowerCase().includes(q)))
        .sort((a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0)
          || (b.lastUsedAt || 0) - (a.lastUsedAt || 0)
          || a.name.localeCompare(b.name, 'de'))
        .slice(0, 40);
      for (const f of items){
        const star = el('button', { style: 'width:34px;height:34px;font-size:17px;flex:0 0 34px;color:' + (f.favorite ? 'var(--warn)' : 'var(--muted)'),
          'aria-label': 'Favorit', onclick: () => { f.favorite = !f.favorite; save(); renderList(); } },
          f.favorite ? '★' : '☆');
        list.append(el('div', { class: 'fentry' },
          star,
          el('button', { class: 'grow', style: 'text-align:left;min-width:0', onclick: () => { close(); openAmountSheet(f, meal); } },
            el('div', { class: 'n' }, f.name),
            el('div', { class: 's' }, (f.brand ? f.brand + ' · ' : '') + fmtNum(f.kcal, 0) + ' kcal / 100 ' + f.unit)),
          el('button', { style: 'width:34px;height:34px;flex:0 0 34px;color:var(--muted)', 'aria-label': 'Bearbeiten',
            onclick: () => openFoodEditor(f.id, {}, () => renderList()) }, '✎')));
      }
      if (!items.length){
        list.append(el('div', { class: 'chart-empty' },
          q ? 'Nichts gefunden — über „Neu" oder den Scanner anlegen.' : 'Noch keine Lebensmittel. Scanne ein Produkt oder lege eins über „Neu" an.'));
      }
    }
    search.addEventListener('input', renderList);
    body.append(search, list);
    body.append(el('button', { class: 'btn ghost block', style: 'margin-top:10px;color:var(--muted)',
      onclick: () => { close(); openQuickEntry(meal); } }, 'Schnell-Eintrag (nur Kalorien/Makros) …'));
    renderList();
  });
}

/* Lebensmittel anlegen/bearbeiten (Werte pro 100 g/ml) */
function openFoodEditor(foodId, prefill, onSaved){
  const isNew = !foodId;
  const f = isNew
    ? Object.assign({ id: uid(), name: '', brand: '', unit: 'g', kcal: null, fat: null, carb: null, prot: null,
        portion: null, barcode: null, favorite: false, createdAt: Date.now(), lastUsedAt: null }, prefill || {})

  if (!f) return;
  openSheet(isNew ? 'Neues Lebensmittel' : f.name, (body, close) => {
    const nameIn = el('input', { class: 'in', value: f.name, placeholder: 'z. B. Magerquark' });
    const brandIn = el('input', { class: 'in', value: f.brand, placeholder: 'Marke (optional)' });
    const unitSel = el('select', { class: 'in' },
      el('option', { value: 'g' }, 'Gramm (fest)'),
      el('option', { value: 'ml' }, 'Milliliter (flüssig)'));
    unitSel.value = f.unit;
    const numIn = (val, ph) => el('input', { class: 'in', inputmode: 'decimal', autocomplete: 'off',
      value: val === null || val === undefined ? '' : fmtInput(val), placeholder: ph, style: 'text-align:center' });
    const kcalIn = numIn(f.kcal, 'kcal'), fatIn = numIn(f.fat, 'Fett'),
      carbIn = numIn(f.carb, 'KH'), protIn = numIn(f.prot, 'Eiweiß');
    const portIn = el('input', { class: 'in', inputmode: 'numeric', value: f.portion ?? '',
      placeholder: 'z. B. 250' });
    body.append(
      el('label', { class: 'f' }, el('span', {}, 'Name'), nameIn),
      el('label', { class: 'f' }, el('span', {}, 'Marke'), brandIn),
      el('label', { class: 'f' }, el('span', {}, 'Einheit'), unitSel),
      el('label', { class: 'f' }, el('span', {}, 'Nährwerte pro 100 g/ml (von der Packung)'),
        el('div', { class: 'row' }, kcalIn, protIn, fatIn, carbIn),
        el('div', { class: 'row', style: 'margin-top:3px' },
          el('span', { class: 'sub grow', style: 'text-align:center' }, 'kcal'),
          el('span', { class: 'sub grow', style: 'text-align:center' }, 'Eiweiß g'),
          el('span', { class: 'sub grow', style: 'text-align:center' }, 'Fett g'),
          el('span', { class: 'sub grow', style: 'text-align:center' }, 'KH g'))),
      el('label', { class: 'f' }, el('span', {}, 'Übliche Portion in g/ml (optional, für Schnellauswahl)'), portIn));
    if (f.barcode) body.append(el('div', { class: 'sub', style: 'margin-top:8px' }, 'Strichcode: ' + f.barcode));
    body.append(el('button', { class: 'btn primary block', style: 'margin-top:16px', onclick: () => {
      const name = nameIn.value.trim();
      const kcal = parseNum(kcalIn.value);
      if (!name){ nameIn.classList.add('err'); nameIn.focus(); return; }
      if (kcal === null){ kcalIn.classList.add('err'); kcalIn.focus(); return; }
      f.name = name;
      f.brand = brandIn.value.trim();
      f.unit = unitSel.value === 'ml' ? 'ml' : 'g';
      f.kcal = Math.round(kcal);
      f.fat = parseNum(fatIn.value) ?? 0;
      f.carb = parseNum(carbIn.value) ?? 0;
      f.prot = parseNum(protIn.value) ?? 0;
      const po = parseInt0(portIn.value);
      f.portion = po && po > 0 ? po : null;

    if (!isNew){
      body.append(el('button', { class: 'btn block danger', style: 'margin-top:8px', onclick: async () => {
        if (await confirmDlg(`„${f.name}" aus deiner Lebensmittel-Liste löschen? Bereits eingetragene Tage bleiben unverändert.`, { okLabel: 'Löschen', danger: true })){
          state.foods = state.foods.filter(x => x.id !== f.id);
          save(); close();
          if (onSaved) onSaved(null);
        }
      } }, 'Löschen'));
    }
    if (isNew && !f.name) setTimeout(() => nameIn.focus(), 60);
  });
}

/* Menge wählen und in den Tag eintragen */
function openAmountSheet(food, meal, editCtx){
  if (!food) return;
  openSheet(food.name, (body, close) => {
    body.append(el('div', { class: 'sub' },
      (food.brand ? food.brand + ' · ' : '') +
      `${fmtNum(food.kcal, 0)} kcal · E ${fmtNum(food.prot)} · F ${fmtNum(food.fat)} · KH ${fmtNum(food.carb)} pro 100 ${food.unit}`));
    const gIn = el('input', { class: 'in', inputmode: 'numeric', autocomplete: 'off',
      style: 'margin-top:12px;font-size:22px;text-align:center;font-weight:700',
      value: String(editCtx ? editCtx.entry.grams || 100 : (food.portion || 100)) });
    const preview = el('div', { class: 'sub', style: 'margin-top:8px;text-align:center' });
    function upd(){
      const g = parseInt0(gIn.value);
      if (!g || g <= 0){ preview.textContent = 'Menge in ' + food.unit + ' eingeben'; return; }
      const m = foodMacros(food, g);
      preview.textContent = `= ${fmtNum(m.kcal, 0)} kcal · E ${fmtNum(m.prot)} g · F ${fmtNum(m.fat)} g · KH ${fmtNum(m.carb)} g`;
    }
    gIn.addEventListener('input', upd);
    const chips = el('div', { style: 'display:flex;gap:8px;margin-top:10px' });
    const amounts = [50, 100, 150, 200];
    if (food.portion && !amounts.includes(food.portion)) amounts.push(food.portion);
    for (const a of amounts.sort((x, y) => x - y)){
      const chip = el('button', { class: 'btn small grow', onclick: () => { gIn.value = String(a); upd(); } },
        String(a) + (food.portion === a ? ' ●' : ''));
      /* Chips klauen dem Mengenfeld nicht den Fokus (Tastatur bleibt offen) */
      chip.addEventListener('pointerdown', ev => ev.preventDefault());
      chip.addEventListener('mousedown', ev => ev.preventDefault());
      chips.append(chip);
    }
    let curMeal = editCtx ? editCtx.entry.meal : meal;
    const seg = el('div', { class: 'seg', style: 'margin-top:12px' });
    function renderSeg(){
      seg.innerHTML = '';
      for (const [k, n] of MEALS)
        seg.append(el('button', { class: k === curMeal ? 'on' : '', onclick: () => { curMeal = k; renderSeg(); } }, n));
    }
    renderSeg();
    body.append(el('label', { class: 'f' }, el('span', {}, 'Menge in ' + food.unit), gIn), preview, chips, seg);
    upd();
    body.append(el('button', { class: 'btn primary block', style: 'margin-top:14px', onclick: () => {
      const g = parseInt0(gIn.value);
      if (!g || g <= 0){ gIn.classList.add('err'); return; }
      const m = foodMacros(food, g);
      if (editCtx){
        Object.assign(editCtx.entry, { grams: g, meal: curMeal, ...m, name: food.name });
      } else {
        const dk = activeFoodDay();
        ensureDay(dk).entries.push({ id: uid(), foodId: food.id, name: food.name, grams: g,
          ...m, meal: curMeal, ts: Date.now() });
      }
      food.lastUsedAt = Date.now();
      save(); close();
      if (curView === 'ernaehrung') renderErnaehrung();
      toast(editCtx ? 'Eintrag geändert' : 'Eingetragen: ' + fmtNum(m.kcal, 0) + ' kcal');
    } }, editCtx ? 'Ändern' : 'Eintragen'));
    if (editCtx){
      body.append(el('button', { class: 'btn block danger', style: 'margin-top:8px', onclick: async () => {
        if (await confirmDlg('Diesen Eintrag löschen?', { okLabel: 'Löschen', danger: true })){

          }
          save(); close(); renderErnaehrung();
        }

    }
  });
}

      prot: Math.round(entry.prot * f100 * 10) / 10,

/* ---------- Strichcode-Scanner (ZXing) + Open Food Facts ---------- */
let zxingLoadP = null;
function loadZXing(){
  if (window.ZXing) return Promise.resolve();
  if (zxingLoadP) return zxingLoadP;
  zxingLoadP = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'zxing.min.js';
    sc.onload = () => res();
    sc.onerror = () => { zxingLoadP = null; rej(new Error('zxing-load')); };
    document.head.append(sc);
  });
  return zxingLoadP;
}
function openScanner(onCode){
  let reader = null;
  let video = null;
  let finished = false;
  let closed = false;
  /* Kamera IMMER vollständig stoppen: ZXing zurücksetzen UND alle Video-Spuren beenden */
  const stopReader = () => {
    try { if (reader) reader.reset(); } catch (e) {}
    try {
      const src = video && video.srcObject;
      if (src && src.getTracks) src.getTracks().forEach(tr => tr.stop());
      if (video) video.srcObject = null;
    } catch (e) {}
  };
  openSheet('Strichcode scannen', async (body, close) => {
    video = el('video', { class: 'scanvid' });
    video.setAttribute('playsinline', '');
    video.setAttribute('muted', '');
    const stat = el('div', { class: 'sub', style: 'margin:10px 2px' }, 'Kamera wird gestartet …');
    const manual = el('input', { class: 'in', inputmode: 'numeric', autocomplete: 'off',
      placeholder: 'Oder Strichcode-Nummer eintippen …', style: 'margin-top:10px' });
    manual.addEventListener('change', () => {
      const v = manual.value.trim();
      if (v.length >= 8 && !finished){ finished = true; stopReader(); close(); onCode(v); }
    });
    body.append(video, stat, manual);
    try {
      await loadZXing();
      if (closed) return;
      reader = new ZXing.BrowserMultiFormatReader();
      const onResult = (result) => {
        if (closed || finished || !result) return;
        finished = true;
        stopReader();
        vib(60);
        close();
        onCode(String(result.getText()));
      };
      try {
        await reader.decodeFromConstraints(
          { audio: false, video: { facingMode: { ideal: 'environment' } } }, video, onResult);
      } catch (e1) {
        if (closed){ stopReader(); return; }
        await reader.decodeFromVideoDevice(undefined, video, onResult);
      }
      /* Wurde das Fenster während des Kamera-Starts geschlossen, sofort wieder stoppen */
      if (closed){ stopReader(); return; }
      stat.textContent = 'Halte den Strichcode der Packung ins Bild.';
    } catch (e) {
      stopReader();
      if (closed) return;
      video.remove();
      stat.textContent = (e && e.name === 'NotAllowedError')
        ? 'Kamera-Zugriff wurde abgelehnt. Du kannst die Nummer unten eintippen — oder in den iPhone-Einstellungen der Seite die Kamera erlauben.'
        : 'Scanner hier nicht verfügbar. Du kannst die Strichcode-Nummer unten von Hand eintippen.';
    }
  }, () => { closed = true; stopReader(); });
}
async function lookupBarcode(code){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) +
      '.json?fields=product_name,product_name_de,brands,nutriments', { signal: ctrl.signal });
    if (!r.ok) return null;
    const j = await r.json();
    if (j.status !== 1 || !j.product) return null;
    const n = j.product.nutriments || {};
    const g1 = k => Number.isFinite(+n[k]) ? Math.round(+n[k] * 10) / 10 : null;
    const kcal = Number.isFinite(+n['energy-kcal_100g']) ? Math.round(+n['energy-kcal_100g'])
      : (Number.isFinite(+n['energy_100g']) ? Math.round(+n['energy_100g'] / 4.184) : null);
    return {
      name: (j.product.product_name_de || j.product.product_name || '').trim(),
      brand: (j.product.brands || '').split(',')[0].trim(),
      kcal, fat: g1('fat_100g'), carb: g1('carbohydrates_100g'), prot: g1('proteins_100g'),
    };
  } catch (e) {
    throw e;
  } finally {
    clearTimeout(t);
  }
}
function handleBarcode(code, meal){
  const known = state.foods.find(f => f.barcode === code);
  if (known){ openAmountSheet(known, meal); return; }
  toast('Suche Produkt …');
  lookupBarcode(code).then(p => {
    if (p && p.kcal !== null){
      openFoodEditor(null, { barcode: code, name: p.name, brand: p.brand,
        kcal: p.kcal, fat: p.fat ?? 0, carb: p.carb ?? 0, prot: p.prot ?? 0 },
        f => { if (f) openAmountSheet(f, meal); });
      toast('Gefunden: ' + (p.name || 'Produkt') + ' — bitte prüfen und speichern');
    } else if (p){
      /* Produkt bekannt, aber ohne Nährwerte: Name/Marke übernehmen, kcal von der Packung */
      openFoodEditor(null, { barcode: code, name: p.name, brand: p.brand,
        fat: p.fat, carb: p.carb, prot: p.prot },
        f => { if (f) openAmountSheet(f, meal); });
      toast('Gefunden, aber ohne Nährwerte — bitte kcal von der Packung abtippen');
    } else {
      openFoodEditor(null, { barcode: code }, f => { if (f) openAmountSheet(f, meal); });
      toast('Produkt nicht in der Datenbank — bitte von der Packung abtippen');
    }
  }).catch(() => {
    openFoodEditor(null, { barcode: code }, f => { if (f) openAmountSheet(f, meal); });
    toast('Keine Verbindung — bitte von der Packung abtippen');
  });
}

/* Sicherung ZUSAMMENFÜHREN: ergänzt nur, was auf dem Gerät fehlt — nichts geht verloren */
function mergeBackup(obj){
  const imp = migrate(JSON.parse(JSON.stringify(obj)));
  const nameKey = s => s.trim().toLowerCase();
  const byId = new Map(state.exercises.map(e => [e.id, e]));
  const byName = new Map(state.exercises.map(e => [nameKey(e.name), e]));
  const remap = new Map();
  let exAdded = 0;
  for (const ex of imp.exercises){
    if (byId.has(ex.id)) continue;
    const match = byName.get(nameKey(ex.name));
    if (match) remap.set(ex.id, match.id);
    else { state.exercises.push(ex); byId.set(ex.id, ex); byName.set(nameKey(ex.name), ex); exAdded++; }
  }
  const haveW = new Set(state.workouts.map(w => w.id));
  let woAdded = 0;
  for (const w of imp.workouts){
    if (haveW.has(w.id)) continue;
    /* auch angefangene Trainings mitnehmen, sofern sie echte Sätze enthalten */
    if (!w.finishedAt && !w.entries.some(en => validSets(en).length)) continue;
    for (const en of w.entries)
      if (remap.has(en.exerciseId)) en.exerciseId = remap.get(en.exerciseId);
    state.workouts.push(w); woAdded++;
  }
  const haveP = new Set(state.plans.map(p => p.id));
  const havePName = new Set(state.plans.map(p => p.name.trim().toLowerCase()));
  for (const p of imp.plans){
    if (haveP.has(p.id) || havePName.has(p.name.trim().toLowerCase())) continue;
    p.items = p.items
      .map(it => ({ ...it, exerciseId: remap.get(it.exerciseId) || it.exerciseId }))
      .filter(it => byId.has(it.exerciseId));
    state.plans.push(p);
    havePName.add(p.name.trim().toLowerCase());
  }
  /* Ernährung: fehlende Lebensmittel und Tagebuch-Einträge ergänzen */
  const fById = new Map(state.foods.map(f => [f.id, f]));
  const fByCode = new Map(state.foods.filter(f => f.barcode).map(f => [f.barcode, f]));
  const fByName = new Map(state.foods.map(f => [f.name.trim().toLowerCase(), f]));
  const fRemap = new Map();
  let foodAdded = 0, entryAdded = 0;
  for (const f of imp.foods){
    if (fById.has(f.id)) continue;
    const match = (f.barcode && fByCode.get(f.barcode)) || fByName.get(f.name.trim().toLowerCase());
    if (match){ fRemap.set(f.id, match.id); continue; }
    state.foods.push(f);
    foodAdded++;
    fById.set(f.id, f);
    if (f.barcode) fByCode.set(f.barcode, f);
    fByName.set(f.name.trim().toLowerCase(), f);
  }
  /* Supplemente ergänzen (per id, Namens-Dubletten überspringen) */
  const sById = new Set(state.supps.map(s => s.id));
  const sByName = new Set(state.supps.map(s => s.name.trim().toLowerCase()));
  for (const s of imp.supps){
    if (sById.has(s.id) || sByName.has(s.name.trim().toLowerCase())) continue;
    state.supps.push(s);
    sById.add(s.id);
    sByName.add(s.name.trim().toLowerCase());
  }
  /* Körpergewicht: fehlende Tage übernehmen */
  for (const [dk, kg] of Object.entries(imp.weights))
    if (state.weights[dk] === undefined) state.weights[dk] = kg;
  const remapEntry = e => { if (e.foodId && fRemap.has(e.foodId)) e.foodId = fRemap.get(e.foodId); };
  for (const [dk, day] of Object.entries(imp.days)){
    if (!state.days[dk]){
      for (const e of day.entries) remapEntry(e);
      state.days[dk] = day;
      entryAdded += day.entries.length;
      continue;
    }
    const haveE = new Set(state.days[dk].entries.map(e => e.id));
    for (const e of day.entries){
      if (haveE.has(e.id)) continue;
      remapEntry(e);
      state.days[dk].entries.push(e);
      entryAdded++;
    }
  }
  save();
  return { woAdded, exAdded, foodAdded, entryAdded };
}
function importFromObj(obj, close){
  if (!obj || typeof obj !== 'object' || !Array.isArray(obj.exercises) || !Array.isArray(obj.workouts)){
    toast('Das ist keine gültige Eisenbuch-Sicherung');
    return;
  }
  const n = obj.workouts.filter(w => w && w.finishedAt).length;
  const when = obj.meta && obj.meta.updatedAt ? fmtFull(dateKey(new Date(obj.meta.updatedAt))) : 'unbekannt';
  choiceDlg(`Sicherung gefunden: ${plural(n, 'Training', 'Trainings')}, Stand ${when}. Wie laden?`, [
    { label: 'Zusammenführen (empfohlen)', value: 'merge', cls: 'primary' },
    { label: 'Alles ersetzen (Gerätestand geht verloren)', value: 'replace', cls: 'danger' },
    { label: 'Abbrechen', value: null },
  ]).then(mode => {
    if (mode === 'merge'){
      const res = mergeBackup(obj);
      if (close) close();
      renderBanner(); renderCurrentView(); renderTimer();
      toast((res.woAdded || res.exAdded || res.foodAdded || res.entryAdded)
        ? `Ergänzt: ${plural(res.woAdded, 'Training', 'Trainings')} · ${plural(res.exAdded, 'Übung', 'Übungen')} · ${plural(res.entryAdded, 'Essens-Eintrag', 'Essens-Einträge')}`
        : 'Nichts zu ergänzen — alles schon da');
    } else if (mode === 'replace'){
      const deviceLoads = state.meta.loads || 0;
      state = migrate(obj);
      state.activeWorkoutId = state.workouts.some(w => w.id === state.activeWorkoutId) && state.activeWorkoutId || null;
      state.timer = null;
      state.meta.loads = deviceLoads;
      /* Der geladene Stand liegt in diesem Moment nachweislich als Datei vor → gilt als gesichert */
      state.meta.lastBackupAt = Date.now();
      state.meta.workoutsAtBackup = finishedCount();
      save();
      if (close) close();
      renderBanner(); renderCurrentView(); renderTimer();
      toast('Sicherung geladen');
    }
  });
}
function openImport(){
  openSheet('Daten wiederherstellen', (body, close) => {
    body.append(el('div', { class: 'sub' }, 'Sicherungs-Datei auswählen — oder den gesicherten Text unten einfügen.'));

  renderTimer();
  syncWakeLock();
  window.addEventListener('resize', debounce(() => {
    if (curView === 'statistik') renderStatistik();
  }, 200));
  /* Offline-Fähigkeit — funktioniert nur auf richtigem Hosting, sonst still ignoriert */
  if ('serviceWorker' in navigator){
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  }
}
init();
</script>
